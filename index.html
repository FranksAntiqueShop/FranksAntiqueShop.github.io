<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프랭크 도구 모음</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="brand-text">
          <h1>Frank's Antique Shop</h1>
          <span class="subtitle">텍스트 입력 도구</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- 퀵 툴: 북마크릿 생성기 (좌: 버튼, 우: 2단 설정) -->
      <section class="card quick-tool-card">
        <div class="quick-tool-grid">
          <div class="quick-left">
            <div class="card-header">
              <span class="badge">QUICK TOOL</span>
              <h2>관리자 페이지 원클릭 버튼 등록</h2>
            </div>
            <p class="desc">
              아래 노란색 버튼을 마우스로 끌어서 <strong>크롬 북마크 바</strong>에 넣어두세요.
            </p>
            <div class="bookmark-btn-wrap">
              <a id="bookmarkletLink" href="#" class="bookmark-btn">⭐ 프랭크 관리 버튼 생성기</a>
            </div>
          </div>

          <div class="quick-right-settings">
            <div class="input-field-group">
              <label for="workerNameInput">현재 근무자</label>
              <input type="text" id="workerNameInput" placeholder="이름" value="프랭크" autocomplete="off" />
            </div>
            <div class="input-field-group">
              <label for="depositDateInput">입금 일자</label>
              <input type="date" id="depositDateInput" />
            </div>
          </div>
        </div>
      </section>

      <!-- 예약 문자 제작 -->
      <section class="card">
        <div class="card-header">
          <span class="badge">RESERVATION</span>
          <h2>예약 문자 개별 제작</h2>
        </div>
        <p class="desc">엑셀 행 추가 방식 그대로 복사 후 붙일 시 전화번호 먼저 추출</p>
        
        <div class="input-wrap">
          <textarea id="reservationInput" rows="2" placeholder="예약 사이트에서 행 붙여넣기 (Ctrl+V)"></textarea>
        </div>

        <div id="stepContainer" class="step-card hidden">
          <div class="step-info">
            <div class="info-row">
              <strong id="targetCustomer">-</strong>
            </div>
            <div class="info-row">
              <span id="targetPhone" class="info-value text-muted">-</span>
            </div>
          </div>
          <button id="btnCopyMsg" class="action-btn">문자 본문 복사하기 Space</button>
        </div>
      </section>

      <!-- 정산 보고 제작 -->
      <section class="card">
        <div class="card-header">
          <span class="badge">REPORT</span>
          <h2>정산 보고 제작</h2>
        </div>
        <p class="desc">엑셀에서 "가격 굿즈 할인 총 금액 카드 계좌 예약금 받은 금액" 행을 복사 후 붙이기</p>
        
        <div class="input-wrap">
          <textarea id="settlementInput" rows="2" placeholder="정산 데이터 한 행을 붙여넣으세요..."></textarea>
        </div>
      </section>
    </main>

    <div id="toast" class="toast"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
